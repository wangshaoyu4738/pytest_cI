[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# addopts 已移除静态的 --html：HTML 报告文件名改由 run.py 动态注入时间戳（reports/report_<时间戳>.html），避免每次覆盖
# --alluredir 让 pytest 把 allure 原始结果写到 reports/allure_raw；--clean-alluredir 每次运行前清空旧结果
addopts = -v -s --alluredir=reports/allure_raw --clean-alluredir -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
