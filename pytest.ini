[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# addopts 追加了 --alluredir，让 pytest 把 allure 原始结果写到 reports/allure_raw；
# --clean-alluredir 会在每次运行前清空旧结果，避免历史数据混入新报告
addopts = -v -s --html=reports/report.html --self-contained-html --alluredir=reports/allure_raw --clean-alluredir -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
